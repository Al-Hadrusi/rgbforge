name: Release

# Push a tag like v0.1.0 to build, test and publish a ready-to-run Linux download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Built on an older Ubuntu so the program also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests (incl. every driver's write allow-list)
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="rgbforge-${VERSION}-x86_64-linux"
          mkdir -p "$NAME/packaging"
          cp target/release/rgbforge install.sh README.md LICENSE SECURITY.md "$NAME/"
          cp packaging/rgbforge.desktop packaging/rgbforge-helper.service "$NAME/packaging/"
          strip "$NAME/rgbforge"
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          ls -la "$NAME.tar.gz"*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" rgbforge-*.tar.gz rgbforge-*.tar.gz.sha256 \
            --title "RGB Forge $GITHUB_REF_NAME" --notes-file .github/release-notes.md
