[package]
name = "rgbforge"
version = "0.1.0"
edition = "2024"
description = "Safe, user-friendly RGB lighting control for Linux"
license = "GPL-3.0-only"
repository = "https://github.com/Al-Hadrusi/rgbforge"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
i2cdev = "0.6"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
# Zero `unsafe` in this crate, enforced by the compiler.
unsafe_code = "forbid"

[lints.clippy]
# No hidden crashes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true
